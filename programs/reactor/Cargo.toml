[package]
name = "reactor"
version = "0.1.0"
description = "Reactor transient executability-lock program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reactor"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "0.32.1"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor-compat"] }
