name: Chamber CI

on:
  pull_request:
    paths:
      - 'chamber/**'
      - '.github/workflows/chamber-ci.yml'
  push:
    branches: [main]
    paths:
      - 'chamber/**'
      - '.github/workflows/chamber-ci.yml'

jobs:
  chamber:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chamber
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Test truth layer
        run: npm test

      - name: Build production app
        run: npm run build
